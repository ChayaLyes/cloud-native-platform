# La GatewayClass declare qu'une implementation de passerelle existe sur
# ce cluster, fournie par le controller Envoy Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# La Gateway est la porte d'entree concrete : elle ecoute en HTTP sur le
# port 80. Envoy Gateway va creer automatiquement les pods Envoy qui
# feront passer le trafic.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # Autorise les HTTPRoute de n'importe quel namespace a s'attacher
          # a cette Gateway. Necessaire pour qu'ArgoCD, Grafana, etc.
          # puissent s'y brancher depuis leurs propres namespaces.
          from: All
