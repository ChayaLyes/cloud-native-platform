# Cilium sur k3s single-node
operator:
  # Le defaut est 2 replicas ; sur un seul noeud le second reste Pending
  replicas: 1

ipam:
  # Utilise le podCIDR attribue par k3s au noeud plutot que le pool interne
  # de Cilium, ce qui evite tout chevauchement avec le cluster-cidr k3s
  mode: kubernetes

# Hubble : observabilite des flux reseau
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

# Note de version : k3s epingle sur le canal v1.35 volontairement.
# Cilium 1.19.6 est e2e-teste sur k8s 1.32 a 1.35 uniquement ; le canal
# stable de k3s livrait 1.36, hors de la fenetre testee.
